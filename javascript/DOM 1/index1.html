<!-- rel stands for relationship. It tells the browser what relationship the linked file has with the current HTML document.
means:
"The file specified in href is a CSS stylesheet that should be used to style this webpage."

How it works
<link> → Creates a connection to an external file.
rel="stylesheet" → Specifies that the external file contains CSS styles.
href="style.css" → Gives the path to the CSS file. -->
